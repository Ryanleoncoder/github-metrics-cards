name: Update GitHub Metrics Cards

on:
  schedule:
    # Runs daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Allow manual trigger from Actions tab
  push:
    branches: [main]
    paths: ['scripts/**', 'themes/**', 'config.yml', '.github/workflows/metrics.yml']

permissions:
  contents: write

concurrency:
  group: metrics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Check generator regressions
        run: python -m unittest discover -s tests -v

      - name: Generate Dynamic Metrics SVGs
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_metrics.py

      - name: Commit & Push updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- assets/metrics/year-in-code.svg assets/metrics/languages-commits.svg assets/metrics/languages-recent.svg assets/metrics/metrics.json
          git diff --cached --quiet || git commit -m "chore: update dynamic GitHub metrics SVGs [skip ci]"
          git push
