name: Test metrics generator
on:
  pull_request:
  push:
    paths: ['scripts/**', 'themes/**', 'tests/**', 'config.yml', '.github/workflows/tests.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
